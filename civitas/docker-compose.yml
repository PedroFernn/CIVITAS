# Stack completo: db → migrate (una vez) → api → web → caddy.   Arranque:  docker compose up -d --build
# Datos de demostración:  docker compose run --rm etl mvp2     (ver README.md)
x-api-env: &api-env
  DATABASE_URL: postgresql://civitas:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/civitas

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: civitas
      POSTGRES_DB: civitas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      # -h 127.0.0.1: comprueba el puerto TCP, no el socket Unix (durante el init, la imagen levanta un servidor temporal que solo escucha en el socket)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U civitas -d civitas"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: .., dockerfile: civitas/Dockerfile, target: api }
    command: ["node", "dist/cli.js", "migrar"]
    environment: *api-env
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    build: { context: .., dockerfile: civitas/Dockerfile, target: api }
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: "4000"
      API_BASE_PATH: /api
      WEB_ORIGIN: ${DOMAIN:-http://localhost}
      # Cuentas de ejemplo usr1/adm (contraseñas triviales). Vacío = solo en local (DOMAIN sin definir); 1 = forzar; 0 = apagar (y eliminar las que existan). En producción: 0.
      DEMO_USERS: ${DEMO_USERS:-}
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: .., dockerfile: civitas/Dockerfile, target: web }
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    depends_on: [api]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}   # local: HTTP plano, sin TLS. Con un dominio real Caddy emite HTTPS solo.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]

  # ── herramientas (no arrancan con `up`) ──
  etl:
    profiles: ["tools"]
    build: { context: .., dockerfile: civitas/Dockerfile, target: api }
    entrypoint: ["node", "dist/cli.js"]
    environment:
      <<: *api-env
      CIVITAS_ALLOW_RESET: "1"      # la BD del compose es desechable
    volumes: ["./data/raw:/app/data/raw:ro"]
    depends_on: { db: { condition: service_healthy } }

  test:
    profiles: ["test"]
    build: { context: .., dockerfile: civitas/Dockerfile, target: test }
    environment:
      TEST_DATABASE_URL: postgresql://civitas:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/civitas_test
    depends_on: { db: { condition: service_healthy } }

volumes:
  dbdata:
  caddy_data:
