services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: civitas
      POSTGRES_DB: civitas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civitas -d civitas"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: api/Dockerfile }
    command: ["node", "/app/scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://civitas:${POSTGRES_PASSWORD}@db:5432/civitas
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://civitas:${POSTGRES_PASSWORD}@db:5432/civitas
      PORT: "4000"
      API_BASE_PATH: /api
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: ./web }
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}  # local: HTTP plano, sin TLS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]

volumes:
  dbdata:
  caddy_data:
